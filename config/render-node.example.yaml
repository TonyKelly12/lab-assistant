# Render node (Pi 4 #2, drives the Mooka). Copy to config/render-node.yaml and edit.
node_name: bench-render
surface: bench
projector_size: [1920, 1080]           # set the Pi's HDMI output to exactly this
calibration_file: calibration/bench.json

http:
  host: 0.0.0.0
  port: 8090

mqtt:
  # The render node must be on the broker to receive scenes (lab/display/<surface>)
  # from the router, bench-vision and the brain. HTTP /scene still works regardless.
  enabled: true
  host: orin.local            # the broker (the Orin); use its IP if .local won't resolve
  port: 1883
  username: lab
  # password: prefer the MQTT_PASS env var (see systemd/render-node.service); or set here
  password: change-me
