# Camera node (Pi 4 #1). Copy to config/camera-node.yaml and edit.
node_name: bench-cam

http:
  host: 0.0.0.0
  port: 8080

# Optional. Leave enabled: false until Mosquitto is running on the Orin.
mqtt:
  enabled: false
  host: orin.local
  port: 1883
  username: lab
  password: change-me

cameras:
  bench-overhead:
    type: picamera          # ribbon-cable camera
    index: 0
    # main_size: [2592, 1944]  # default: sensor full resolution
    lores_size: [640, 480]
    track: true             # markers + motion on the low-res stream
    track_hz: 5
    motion_fraction: 0.005  # share of pixels that must change to count as motion
    idle_after_s: 10

  bench-microscope:
    enabled: false          # set true once the TOMLOV shows up in v4l2-ctl --list-devices
    type: usb               # TOMLOV in PC camera mode
    device: /dev/video1     # its /dev/videoN from: v4l2-ctl --list-devices
                            # (not /dev/video0 on a Pi with a ribbon camera: that one is the ribbon camera)
    size: [1920, 1080]      # largest size from: v4l2-ctl -d /dev/video0 --list-formats-ext
    track: false            # snapshots on request only

  # Inspection camera for component ID (the LG 1080p webcam on an arm). Point it
  # at a held-up part; the vision bridge pulls /snapshot/inspect.jpg on request.
  # Not tied to the bench calibration - it only ever takes on-request photos.
  inspect:
    enabled: false          # set true once the webcam shows up in v4l2-ctl --list-devices
    type: usb
    device: /dev/video2     # its /dev/videoN from: v4l2-ctl --list-devices
                            # (ribbon cam is video0; the TOMLOV, if present, takes another)
    size: [1920, 1080]
    track: false            # on-request snapshots only (no motion/marker tracking)
    controls:               # optional V4L2 controls; omit any your webcam ignores
      autofocus: 1          # 1 = let it autofocus (good for an arm you reposition)
      # focus: 30           # or set autofocus: 0 and a fixed focus for a repeatable
      #                     # working distance (value range is webcam-specific)
      # zoom: 100
