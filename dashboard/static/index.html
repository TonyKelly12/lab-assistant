<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lab Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#06090e; --bg2:#0b111a; --bg3:#0f1722; --line:#1a2a37; --line2:#24394a;
    --fg:#d7e4ea; --muted:#8197a4; --dim:#5a6e7a;
    --cyan:#00e5ff; --magenta:#ff2d7e; --amber:#ffb000; --green:#35e08a; --red:#ff4d5e;
    --dsp:"Chakra Petch","Arial Narrow",sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
    --body:"IBM Plex Sans",system-ui,sans-serif;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(900px 400px at 85% -5%,rgba(0,229,255,.07),transparent 60%),var(--bg);
    color:var(--fg);font:400 15px/1.5 var(--body);
    padding:0 max(16px,env(safe-area-inset-right,0)) 48px max(16px,env(safe-area-inset-left,0))}
  .wrap{max-width:1000px;margin:0 auto}
  header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:22px 0 16px;border-bottom:1px solid var(--line)}
  h1{font:700 26px/1 var(--dsp);letter-spacing:.06em;text-transform:uppercase;margin:0;color:#eaf7fb}
  h1 .dot{color:var(--cyan)}
  .clock{font:500 12px/1 var(--mono);color:var(--dim);margin-left:auto}
  .keywrap{display:flex;align-items:center;gap:8px;margin-left:12px}
  .keywrap input{background:var(--bg3);border:1px solid var(--line2);border-radius:3px;color:var(--fg);
    font:400 13px/1 var(--mono);padding:8px 10px;width:150px}
  .keywrap label{font:500 10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  h2{font:600 14px/1 var(--dsp);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:30px 0 12px}
  .node{border:1px solid var(--line);border-radius:5px;background:var(--bg2);margin-top:14px;overflow:hidden}
  .node-head{display:flex;align-items:center;gap:10px;padding:11px 15px;background:var(--bg3);border-bottom:1px solid var(--line)}
  .node-head b{font:600 15px/1 var(--dsp);letter-spacing:.05em;text-transform:uppercase}
  .node-head .off{font:500 11px/1 var(--mono);color:var(--red);letter-spacing:.1em;text-transform:uppercase}
  .svc{display:flex;align-items:center;gap:12px;padding:11px 15px;border-top:1px solid var(--line);flex-wrap:wrap}
  .svc:first-child{border-top:0}
  .led{width:11px;height:11px;border-radius:50%;flex:none;background:var(--dim)}
  .led.active{background:var(--green);box-shadow:0 0 7px var(--green)}
  .led.failed{background:var(--red);box-shadow:0 0 7px var(--red)}
  .led.inactive{background:var(--dim)}
  .led.missing{background:#3a2530;border:1px solid var(--red)}
  .svc .nm{font:500 14px/1.2 var(--mono);min-width:0;overflow-wrap:anywhere}
  .svc .st{font:500 10.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .svc .st.failed{color:var(--red)} .svc .st.active{color:var(--green)}
  .svc .noen{font:500 9.5px/1 var(--mono);color:var(--amber);border:1px solid color-mix(in srgb,var(--amber) 40%,var(--line));padding:3px 5px;border-radius:2px;letter-spacing:.08em}
  .btns{margin-left:auto;display:flex;gap:6px}
  button{font:500 12px/1 var(--mono);letter-spacing:.04em;border-radius:3px;padding:8px 11px;cursor:pointer;
    background:var(--bg3);border:1px solid var(--line2);color:var(--fg)}
  button:hover{border-color:var(--cyan);color:var(--cyan)}
  button.stop:hover{border-color:var(--red);color:var(--red)}
  button:disabled{opacity:.35;cursor:not-allowed}
  .remotes{display:flex;flex-wrap:wrap;gap:8px;padding:11px 15px;border-top:1px solid var(--line)}
  .pill{display:inline-flex;align-items:center;gap:7px;font:500 12px/1 var(--mono);color:var(--muted);
    border:1px solid var(--line2);border-radius:20px;padding:6px 11px}
  .deck{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:14px}
  .beat{text-align:left;padding:12px 14px;border:1px solid var(--line2);border-left:2px solid var(--cyan);
    border-radius:3px;background:var(--bg2);color:var(--fg);display:flex;flex-direction:column;gap:4px}
  .beat:hover{background:var(--bg3)}
  .beat .b{font:500 9.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--cyan)}
  .beat .s{font:500 14px/1.3 var(--body)}
  .fire{display:flex;gap:8px;margin-top:12px}
  .fire input{flex:1;min-width:0;background:var(--bg3);border:1px solid var(--line2);border-radius:3px;color:var(--fg);
    font:400 14px/1 var(--mono);padding:11px 12px}
  #logline{font:500 12.5px/1.4 var(--mono);color:var(--dim);margin-top:12px;min-height:18px}
  #logline.ok{color:var(--green)} #logline.err{color:var(--red)}
  .hint{font:400 12px/1.5 var(--mono);color:var(--dim);margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Lab Console<span class="dot">_</span></h1>
    <span class="clock" id="clock">—</span>
    <div class="keywrap">
      <label for="key">Key</label>
      <input id="key" type="password" placeholder="control key" autocomplete="off">
    </div>
  </header>

  <h2>Systems</h2>
  <div id="nodes"></div>

  <h2>Demo deck</h2>
  <div class="deck" id="deck"></div>
  <div class="fire">
    <input id="cmd" placeholder='say something… e.g. "light up column 20"'>
    <button id="fire">Fire ▸</button>
  </div>
  <div id="logline"></div>
  <p class="hint">Green = running · red = failed · amber "no boot" = won't auto-start on power-on. Control needs the key; status is read-only.</p>
</div>

<script>
const $ = s => document.querySelector(s);
const keyEl = $("#key");
try { keyEl.value = localStorage.getItem("labDashKey") || ""; } catch(e){}
keyEl.addEventListener("change", () => { try{ localStorage.setItem("labDashKey", keyEl.value); }catch(e){} });

function headers(){ const h={"Content-Type":"application/json"}; if(keyEl.value) h["X-Dash-Key"]=keyEl.value; return h; }
function logmsg(t, cls){ const l=$("#logline"); l.textContent=t; l.className=cls||""; }

async function control(node, unit, action){
  logmsg(`${action} ${unit}…`);
  try{
    const r = await fetch("/api/control",{method:"POST",headers:headers(),body:JSON.stringify({node,unit,action})});
    const d = await r.json();
    if(r.ok && d.ok) logmsg(`${unit}: ${action} ok`, "ok"); else logmsg(`${unit}: ${d.error||d.detail||"failed"}`, "err");
  }catch(e){ logmsg("request failed: "+e, "err"); }
  setTimeout(refresh, 600);
}

async function fire(cmd){
  if(!cmd) return;
  logmsg(`sending: ${cmd}`);
  try{
    const r = await fetch("/api/demo/fire",{method:"POST",headers:headers(),body:JSON.stringify({cmd})});
    const d = await r.json();
    logmsg(r.ok && d.ok ? `sent: ${cmd}` : (d.error||"failed"), r.ok && d.ok ? "ok":"err");
  }catch(e){ logmsg("request failed: "+e, "err"); }
}

function svcRow(node, s, controllable){
  const en = s.enabled ? "" : `<span class="noen">no boot</span>`;
  const dis = controllable ? "" : "disabled";
  return `<div class="svc">
    <span class="led ${s.state}"></span>
    <span class="nm">${s.unit}</span>
    <span class="st ${s.state}">${s.state}</span>${en}
    <span class="btns">
      <button ${dis} onclick="control('${node}','${s.unit}','start')">Start</button>
      <button class="stop" ${dis} onclick="control('${node}','${s.unit}','restart')">Restart</button>
      <button class="stop" ${dis} onclick="control('${node}','${s.unit}','stop')">Stop</button>
    </span></div>`;
}

function render(data){
  $("#clock").textContent = data.generated_at || "";
  $("#nodes").innerHTML = (data.nodes||[]).map(n => {
    if(n.offline) return `<div class="node"><div class="node-head"><b>${n.node}</b><span class="off">offline</span></div></div>`;
    const svcs = (n.services||[]).map(s => svcRow(n.node, s, n.controllable)).join("") || `<div class="svc"><span class="st">no local services</span></div>`;
    const rem = (n.remotes||[]).length ? `<div class="remotes">` + n.remotes.map(r =>
      `<span class="pill"><span class="led ${r.ok?'active':'failed'}"></span>${r.name}</span>`).join("") + `</div>` : "";
    return `<div class="node"><div class="node-head"><b>${n.node}</b></div>${svcs}${rem}</div>`;
  }).join("");
}

async function refresh(){
  try{ const r = await fetch("/api/status"); render(await r.json()); }
  catch(e){ logmsg("status unreachable: "+e, "err"); }
}

async function loadDeck(){
  try{
    const r = await fetch("/api/demo"); const d = await r.json();
    $("#deck").innerHTML = (d.beats||[]).map(b =>
      `<button class="beat" onclick='fire(${JSON.stringify(b.cmd)})'>
         <span class="b">${b.beat||"beat"}</span><span class="s">${b.say||b.cmd}</span></button>`).join("");
  }catch(e){}
}

$("#fire").addEventListener("click", () => { fire($("#cmd").value.trim()); });
$("#cmd").addEventListener("keydown", e => { if(e.key==="Enter") fire(e.target.value.trim()); });

refresh(); loadDeck(); setInterval(refresh, 4000);
</script>
</body>
</html>
